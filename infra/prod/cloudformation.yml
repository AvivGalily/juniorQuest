AWSTemplateFormatVersion: "2010-09-09"
Description: "Minimal production hosting for Junior Quest with private S3 and CloudFront OAC."

Parameters:
  ProjectSlug:
    Type: String
    Default: juniorquest
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,40}[a-z0-9]$"
    Description: "Lowercase project slug used for resource names."

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectSlug}-${AWS::AccountId}-${AWS::Region}-prod"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3-oac"
        Description: !Sub "OAC for ${AWS::StackName} private S3 origin"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} Junior Quest production"
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOnlyThisCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  LeaderboardTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-leaderboard"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  LeaderboardFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LeaderboardDynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt LeaderboardTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-leaderboard:*"

  LeaderboardFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-leaderboard"
      RetentionInDays: 14

  LeaderboardFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-leaderboard"
      Description: "Global leaderboard API backed by DynamoDB."
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LeaderboardFunctionRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref LeaderboardTable
          MAX_ENTRIES: "100"
          NAME_MAX_LEN: "12"
      Code:
        ZipFile: |
          import json
          import os
          import re
          import uuid
          from datetime import datetime, timezone
          from decimal import Decimal

          import boto3

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])
          max_entries = int(os.environ.get("MAX_ENTRIES", "100"))
          name_max_len = int(os.environ.get("NAME_MAX_LEN", "12"))

          PARTITION_KEY = "GLOBAL"
          SCORE_PAD = 10

          cors_headers = {
              "Content-Type": "application/json",
              "Cache-Control": "no-store",
          }

          def make_sort_key(score, date_iso):
              inverted = str(10**SCORE_PAD - max(0, score)).zfill(SCORE_PAD)
              return f"{inverted}#{date_iso}#{uuid.uuid4().hex[:8]}"

          def sanitize_name(name):
              cleaned = re.sub(r"[^A-Za-z0-9\u0590-\u05FF]", "", str(name or "").strip())
              return cleaned[:name_max_len] or "ANON"

          def resp(status_code, body):
              return {
                  "statusCode": status_code,
                  "headers": cors_headers,
                  "body": json.dumps(body, separators=(",", ":"), default=str),
              }

          def load_entries():
              result = table.query(
                  KeyConditionExpression=boto3.dynamodb.conditions.Key("pk").eq(PARTITION_KEY),
                  Limit=max_entries,
                  ScanIndexForward=True,
              )
              entries = []
              for item in result.get("Items", []):
                  entries.append({
                      "name": str(item.get("name", "ANON")),
                      "score": int(item.get("score", 0)),
                      "dateISO": str(item.get("dateISO", "1970-01-01T00:00:00.000Z")),
                  })
              entries.sort(key=lambda e: e["score"], reverse=True)
              return entries[:max_entries]

          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method", "GET")

              if method == "OPTIONS":
                  return resp(204, {})

              if method == "GET":
                  return resp(200, {"entries": load_entries()})

              if method != "POST":
                  return resp(405, {"message": "Method not allowed"})

              try:
                  payload = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  return resp(400, {"message": "Invalid JSON"})

              name = sanitize_name(payload.get("name"))
              try:
                  score = round(float(payload.get("score", 0)))
              except (TypeError, ValueError):
                  return resp(400, {"message": "Invalid score"})

              date_iso = datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")

              table.put_item(Item={
                  "pk": PARTITION_KEY,
                  "sk": make_sort_key(score, date_iso),
                  "name": name,
                  "score": score,
                  "dateISO": date_iso,
              })

              return resp(200, {"entries": load_entries()})
    DependsOn:
      - LeaderboardFunctionLogGroup

  LeaderboardFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt LeaderboardFunction.Arn
      Cors:
        AllowOrigins:
          - !Sub "https://${SiteDistribution.DomainName}"
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
        MaxAge: 300

  LeaderboardFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref LeaderboardFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

  LeaderboardFunctionPublicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LeaderboardFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  StackName:
    Description: "CloudFormation stack name."
    Value: !Ref AWS::StackName
  BucketName:
    Description: "Private S3 bucket used as the CloudFront origin."
    Value: !Ref SiteBucket
  DistributionId:
    Description: "CloudFront distribution ID."
    Value: !Ref SiteDistribution
  CloudFrontURL:
    Description: "Production CloudFront URL."
    Value: !Sub "https://${SiteDistribution.DomainName}"
  LeaderboardApiUrl:
    Description: "Public HTTPS endpoint used by the browser to read and submit leaderboard scores."
    Value: !GetAtt LeaderboardFunctionUrl.FunctionUrl
